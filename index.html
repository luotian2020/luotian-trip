<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <script>window._AMapSecurityConfig = { securityJsCode: 'b87c66425b6fde8aa84ab7d824e9142f' };</script>

    <style>

        .map-legend b { color: var(--sea); }
        .trip-bar { position: fixed; right: 0; bottom: 0; left: 0; z-index: 12; min-height: 104px; padding: 11px 16px calc(11px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; background: var(--ink); color: white; box-shadow: 0 -8px 30px rgba(14,42,36,.22); transition: transform .25s ease; }
        body.sheet-open .trip-bar { transform: translateY(120%); }

        .trip-stop.done { border-color: #7abca8; color: #a9ead4; text-decoration: line-through; }

        .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 5px 18px 12px; }

        .location-hero-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
        .location-hero h1 { font-size: 25px; letter-spacing: .03em; }

        .meta-line { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }

<body>
    <div class="topbar">
        <div class="brand"><span class="brand-kicker">ZHOU SHAN · HUANIAO ISLAND</span><strong>旅拍行程</strong></div>
        <div class="weather-note">出发前请确认潮汐<br>沙滩点位受退潮影响</div>
    </div>

    <div class="controls">
        <div class="mode-switch">
            <button id="modePoint" class="mode-btn active" onclick="switchMode('point')">全部点位</button>
            <button id="modeChar" class="mode-btn" onclick="switchMode('char')">角色动线</button>
            <button id="modeOverview" class="mode-btn" onclick="showOverview()">行程总览</button>
        </div>
        <div id="characterStrip" class="character-strip"><span class="character-label">选择角色</span><div id="charFilterButtons"></div></div>
    </div>
    <div class="map-legend"><b>绿色虚线</b><br>换装拍摄动线</div>
    <div id="container"></div>

    <section id="tripBar" class="trip-bar" aria-live="polite">
        <div class="trip-head"><div><div id="tripKicker" class="trip-kicker">TODAY'S PLAN</div><div id="tripTitle" class="trip-title">从地图开始安排行程</div></div><div id="tripStat" class="trip-stat">0 站</div></div>
        <div id="tripRoute" class="trip-route"></div>
    </section>

    <aside id="infoPanel" class="info-panel" aria-live="polite">
        <div class="sheet-handle"></div>
        <div class="panel-header"><span class="panel-label">LOCATION BRIEF</span><button class="close-btn" aria-label="关闭详情" onclick="closePanel()">×</button></div>
        <div class="panel-body">
            <section class="location-hero">
                <div class="location-hero-top"><h1 id="locationTitle">地点名称</h1><span id="priority" class="priority">必去</span></div>
                <div id="locationMeta" class="meta-line"></div>
                <div id="conditions" class="conditions"></div>
                <div class="action-row"><button id="saveButton" class="action-btn" onclick="togglePlan()">加入计划</button><button class="action-btn primary" onclick="openNavigation()">开始导航</button><button id="doneButton" class="action-btn" onclick="toggleComplete()">标记完成</button></div>
            </section>
            <section class="section"><div class="section-title"><h2>现场提醒</h2><span>出发前看一眼</span></div><div id="travelTip" class="tip-card"></div></section>
            <section id="characterSection" class="section"><div class="section-title"><h2>拍摄角色</h2><span>切换查看参考</span></div><div id="charTabs" class="char-tabs"></div></section>
            <section class="section"><div class="section-title"><h2>本次镜头重点</h2><span>先拍必需画面</span></div><p id="locationDesc" class="desc"></p></section>
            <section class="section"><div class="section-title"><h2>环境与踩点</h2><span>点击放大</span></div><div id="sceneGrid" class="img-grid"></div></section>
            <section class="section"><div class="section-title"><h2>动作参考</h2><span id="poseCount"></span></div><div id="poseGrid" class="img-grid"></div></section>
        </div>
    </aside>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <button id="lightboxPrev" class="lightbox-nav lightbox-prev" aria-label="上一张" onclick="event.stopPropagation(); showLightboxImage(-1)">‹</button>
        <img id="lightboxImg" src="" alt="放大参考图" onclick="event.stopPropagation()">
        <button id="lightboxNext" class="lightbox-nav lightbox-next" aria-label="下一张" onclick="event.stopPropagation(); showLightboxImage(1)">›</button>
        <div class="zoom-controls" onclick="event.stopPropagation()"><button class="zoom-btn" aria-label="放大图片" onclick="changeLightboxZoom(.25)">＋</button><button class="zoom-btn" aria-label="缩小图片" onclick="changeLightboxZoom(-.25)">−</button><button class="zoom-btn" aria-label="还原图片" onclick="resetLightboxZoom()">还原</button></div>
        <span id="lightboxCount" class="lightbox-count"></span>
    </div>

    <div id="overviewPanel" class="overview-overlay">
        <div class="ov-header">
            <div class="ov-header-left">
                <div class="ov-kicker">TRIP OVERVIEW</div>
                <div class="ov-title" id="ovTitle">花鸟岛旅拍</div>
                <div class="ov-dates" id="ovDates"></div>
            </div>
            <button class="ov-close" aria-label="关闭总览" onclick="closeOverview()">×</button>
        </div>
        <div class="ov-body" id="ovBody"></div>
    </div>

    <script>
        const huaniaoPoints = window.HUANIAO_MAP_DATA || [];
        let map;
        let currentMode = 'point';
        let selectedCharacter = '';
        let activeMarkers = [];
        let currentPolyline = null;
        let currentPointData = null;
        let currentCharacterIndex = 0;
        let currentCharacterData = null;
        let lightboxItems = [];
        let lightboxIndex = 0;
        let lightboxZoom = 1;
        let plannedPointIds = loadSet('huaniao-photo-plan');
        let completedPointIds = loadSet('huaniao-photo-completed');

        function loadSet(key) {
            try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); } catch (error) { return new Set(); }
        }

        function saveSet(key, value) {
            try { localStorage.setItem(key, JSON.stringify(Array.from(value))); } catch (error) { }
        }

        function getAllCharacters() {
            const names = new Set();
            huaniaoPoints.forEach(point => point.characters.forEach(character => names.add(character.name)));
            return Array.from(names);
        }

        function getRoutePoints() {
            if (currentMode === 'char' && selectedCharacter) return huaniaoPoints.filter(point => point.characters.some(character => character.name === selectedCharacter));
            return huaniaoPoints.filter(point => plannedPointIds.has(point.id));
        }

        function distanceBetween(first, second) {
            const radians = Math.PI / 180;
            const latitudeDelta = (second.position[1] - first.position[1]) * radians;
            const longitudeDelta = (second.position[0] - first.position[0]) * radians;
            const latitudeA = first.position[1] * radians;
            const latitudeB = second.position[1] * radians;
            const haversine = Math.sin(latitudeDelta / 2) ** 2 + Math.cos(latitudeA) * Math.cos(latitudeB) * Math.sin(longitudeDelta / 2) ** 2;
            return 6371 * 2 * Math.atan2(Math.sqrt(haversine), Math.sqrt(1 - haversine));
        }

        function routeStats(points) {
            const shootMinutes = points.reduce((total, point) => total + point.duration, 0);
            const distance = points.slice(1).reduce((total, point, index) => total + distanceBetween(points[index], point), 0);
            const travelMinutes = Math.round(distance / 4.5 * 60);
            return { distance, minutes: shootMinutes + travelMinutes };
        }

        function formatDuration(minutes) {
            return minutes >= 60 ? `${Math.floor(minutes / 60)}小时${minutes % 60 ? `${minutes % 60}分` : ''}` : `${minutes}分`;
        }

        function initFilterUI() {
            const container = document.getElementById('charFilterButtons');
            container.innerHTML = getAllCharacters().map(character => `<button class="character-btn" onclick="selectCharacter('${character}', this)">${character}</button>`).join('');
        }

        function initMap() {
            map = new AMap.Map('container', { viewMode: '2D', zoom: 15.2, center: [122.6948, 30.848] });
            renderMapElements();
        }

        function renderMapElements() {
            activeMarkers.forEach(marker => marker.setMap(null));
            activeMarkers = [];
            if (currentPolyline) { currentPolyline.setMap(null); currentPolyline = null; }
            const routePoints = getRoutePoints();
            const routeIds = new Set(routePoints.map(point => point.id));
            const linePath = [];
            huaniaoPoints.forEach(point => {
                const matchedIndex = point.characters.findIndex(character => character.name === selectedCharacter);
                const isVisible = currentMode === 'point' || routeIds.has(point.id);
                if (!isVisible) return;
                const isPlanned = plannedPointIds.has(point.id);
                const marker = new AMap.Marker({
                    position: point.position,
                    title: point.title,
                    offset: new AMap.Pixel(-14, -38),
                    content: `<div style="width:28px;height:36px;border-radius:15px 15px 15px 2px;transform:rotate(-45deg);background:${isPlanned ? '#d96d4e' : '#0b7166'};border:2px solid #fff;box-shadow:0 3px 8px rgba(15,50,43,.28);display:grid;place-items:center"><span style="transform:rotate(45deg);color:#fff;font:700 12px sans-serif">${point.id}</span></div>`,
                    map: map
                });
                marker.on('click', () => showPanel(point, Math.max(0, matchedIndex)));
                activeMarkers.push(marker);
                if (currentMode === 'char' && routeIds.has(point.id)) linePath.push(point.position);
            });
            if (currentMode === 'char' && linePath.length > 1) {
                currentPolyline = new AMap.Polyline({ path: linePath, isOutline: true, outlineColor: '#ffffff', borderWeight: 3, strokeColor: '#0b7166', strokeOpacity: .95, strokeWeight: 5, strokeStyle: 'dashed', strokeDasharray: [12, 7], lineJoin: 'round', map: map });
                map.setFitView([currentPolyline], false, [70, 40, 170, 40]);
            }
            updateTripBar();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('modePoint').classList.toggle('active', mode === 'point');
            document.getElementById('modeChar').classList.toggle('active', mode === 'char');
            document.getElementById('characterStrip').classList.toggle('visible', mode === 'char');
            if (mode === 'char' && !selectedCharacter) {
                const firstButton = document.querySelector('.character-btn');
                if (firstButton) selectCharacter(firstButton.textContent, firstButton);
                return;
            }
            closePanel();
            renderMapElements();
        }

        function selectCharacter(character, element) {
            selectedCharacter = character;
            document.querySelectorAll('.character-btn').forEach(button => button.classList.remove('active'));
            element.classList.add('active');
            closePanel();
            renderMapElements();
        }

        function updateTripBar() {
            const points = getRoutePoints();
            const tripKicker = document.getElementById('tripKicker');
            const tripTitle = document.getElementById('tripTitle');
            const tripStat = document.getElementById('tripStat');
            const tripRoute = document.getElementById('tripRoute');
            if (currentMode === 'char') {
                const stats = routeStats(points);
                tripKicker.textContent = 'CHARACTER ROUTE';
                tripTitle.textContent = `${selectedCharacter} · 推荐拍摄动线`;
                tripStat.textContent = points.length ? `${points.length} 站 · ${formatDuration(stats.minutes)}` : '暂无点位';
            } else if (points.length) {
                const stats = routeStats(points);
                tripKicker.textContent = 'TODAY\'S PLAN';
                tripTitle.textContent = '今日计划已整理';
                tripStat.textContent = `${points.length} 站 · ${formatDuration(stats.minutes)}`;
            } else {
                tripKicker.textContent = 'TODAY\'S PLAN';
                tripTitle.textContent = '从地点详情加入今日计划';
                tripStat.textContent = '0 站';
            }
            tripRoute.innerHTML = points.length ? points.map(point => `<span class="trip-stop ${completedPointIds.has(point.id) ? 'done' : ''}">${point.shortTitle}</span>`).join('') : '<span class="trip-empty">先挑选想拍的地点，再按顺序出发。</span>';
        }

        function showPanel(point, matchedIndex) {
            currentPointData = point;
            currentCharacterIndex = matchedIndex;
            document.getElementById('locationTitle').textContent = point.title;
            document.getElementById('priority').textContent = point.priority;
            document.getElementById('locationMeta').innerHTML = `<span class="meta-chip">最佳：${point.bestTime}</span><span class="meta-chip">拍摄约 ${point.duration} 分钟</span><span class="meta-chip">${point.walking}</span>`;
            document.getElementById('conditions').innerHTML = point.conditions.map(condition => `<span class="condition">${condition}</span>`).join('');
            document.getElementById('travelTip').textContent = point.travelTip;
            const section = document.getElementById('characterSection');
            section.style.display = currentMode === 'char' ? 'none' : 'block';
            const tabs = document.getElementById('charTabs');
            tabs.innerHTML = point.characters.map((character, index) => `<button class="char-tab ${index === matchedIndex ? 'active' : ''}" onclick="switchCharacter(${index}, this)">${character.name}</button>`).join('');
            renderCharacterDetail(point.characters[matchedIndex]);
            updatePointActions();
            document.getElementById('infoPanel').classList.add('active');
            document.body.classList.add('sheet-open');
            map.panTo(point.position);
        }

        function switchCharacter(index, element) {
            currentCharacterIndex = index;
            document.querySelectorAll('.char-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            renderCharacterDetail(currentPointData.characters[index]);
        }

        function renderCharacterDetail(character) {
            currentCharacterData = character;
            document.getElementById('locationDesc').textContent = character.desc;
            document.getElementById('sceneGrid').innerHTML = character.scenes.map((url, index) => `<img src="${url}" alt="${character.name} 环境参考" onclick="openLightbox('scene', ${index})">`).join('');
            document.getElementById('poseGrid').innerHTML = character.poses.map((url, index) => `<img src="${url}" alt="${character.name} 动作参考" onclick="openLightbox('pose', ${index})">`).join('');
            document.getElementById('poseCount').textContent = `${character.poses.length} 张参考`;
        }

        function updatePointActions() {
            const saved = plannedPointIds.has(currentPointData.id);
            const completed = completedPointIds.has(currentPointData.id);
            const saveButton = document.getElementById('saveButton');
            const doneButton = document.getElementById('doneButton');
            saveButton.textContent = saved ? '移出计划' : '加入计划';
            saveButton.classList.toggle('saved', saved);
            doneButton.textContent = completed ? '取消完成' : '标记完成';
            doneButton.classList.toggle('saved', completed);
        }

        function togglePlan() {
            if (plannedPointIds.has(currentPointData.id)) plannedPointIds.delete(currentPointData.id);
            else plannedPointIds.add(currentPointData.id);
            saveSet('huaniao-photo-plan', plannedPointIds);
            updatePointActions();
            renderMapElements();
        }

        function toggleComplete() {
            if (completedPointIds.has(currentPointData.id)) completedPointIds.delete(currentPointData.id);
            else completedPointIds.add(currentPointData.id);
            saveSet('huaniao-photo-completed', completedPointIds);
            updatePointActions();
            updateTripBar();
        }

        function openNavigation() {
            const [longitude, latitude] = currentPointData.position;
            const url = `https://uri.amap.com/marker?position=${longitude},${latitude}&name=${encodeURIComponent(currentPointData.title)}&coordinate=gaode&callnative=1`;
            window.open(url, '_blank', 'noopener');
        }

        function closePanel() {
            document.getElementById('infoPanel').classList.remove('active');
            document.body.classList.remove('sheet-open');
        }

        function openLightbox(type, index) {
            lightboxItems = type === 'pose' ? currentCharacterData.poses : currentCharacterData.scenes;
            lightboxIndex = index;
            resetLightboxZoom();
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
        }

        function updateLightbox() {
            const total = lightboxItems.length;
            document.getElementById('lightboxImg').src = lightboxItems[lightboxIndex];
            document.getElementById('lightboxCount').textContent = `${lightboxIndex + 1} / ${total}`;
            document.getElementById('lightboxPrev').disabled = total <= 1;
            document.getElementById('lightboxNext').disabled = total <= 1;
        }

        function changeLightboxZoom(amount) {
            lightboxZoom = Math.min(2.5, Math.max(1, lightboxZoom + amount));
            document.getElementById('lightboxImg').style.transform = `scale(${lightboxZoom})`;
        }

        function resetLightboxZoom() {
            lightboxZoom = 1;
            document.getElementById('lightboxImg').style.transform = 'scale(1)';
        }

        function showLightboxImage(direction) {
            if (lightboxItems.length <= 1) return;
            lightboxIndex = (lightboxIndex + direction + lightboxItems.length) % lightboxItems.length;
            resetLightboxZoom();
            updateLightbox();
        }

        function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

        document.addEventListener('keydown', event => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') showLightboxImage(-1);
            if (event.key === 'ArrowRight') showLightboxImage(1);
        });

        let gearChecked = loadGearSet();

        function loadGearSet() {
            try { return new Set(JSON.parse(localStorage.getItem('huaniao-gear-check') || '[]')); } catch (error) { return new Set(); }
        }

        function saveGearSet(value) {
            try { localStorage.setItem('huaniao-gear-check', JSON.stringify(Array.from(value))); } catch (error) { }
        }

        function showOverview() {
            document.getElementById('modeOverview').classList.add('active');
            renderOverview();
            document.getElementById('overviewPanel').classList.add('active');
        }

        function closeOverview() {
            document.getElementById('overviewPanel').classList.remove('active');
            document.getElementById('modeOverview').classList.remove('active');
        }

        function renderOverview() {
            const info = window.HUANIAO_TRIP_INFO;
            if (!info) return;
            document.getElementById('ovTitle').textContent = info.title;
            document.getElementById('ovDates').innerHTML = `<span class="ov-date-chip">${info.dates}</span><span class="ov-date-chip">${info.duration}</span>`;
            let html = '';
            const t = info.transport;
            html += `<div class="ov-card"><div class="ov-card-title">往返出行</div>`;
            html += `<div class="ov-route">${t.outbound.route}</div>`;
            html += `<div class="ov-route" style="margin-top:6px;color:var(--muted)">${t.outbound.landTravel}</div>`;
            html += `<div class="ov-timeline">`;
            t.outbound.schedule.forEach(s => { html += `<div class="ov-timeline-item"><div class="ov-time">${s.time}</div><div class="ov-time-detail">${s.detail}</div></div>`; });
            html += `</div><div class="ov-costs">`;
            t.outbound.costs.forEach(c => { html += `<div class="ov-cost-row${c.total ? ' total' : ''}"><span>${c.item}</span><span class="ov-cost-price">${c.price}</span></div>`; });
            html += `</div><div class="ov-note">${t.outbound.note}</div>`;
            html += `<div class="ov-return"><div class="ov-return-item"><div class="ov-return-label">离岛船票</div><div class="ov-return-value">${t.returnTrip.cost}</div></div><div class="ov-return-item"><div class="ov-return-label">离岛时间</div><div class="ov-return-value">${t.returnTrip.departure}</div></div></div></div>`;

            const g = info.gear;
            html += `<div class="ov-card"><div class="ov-card-title">物品准备</div>`;
            html += `<div class="ov-gear-group"><div class="ov-gear-label">服装 / 假发 <span style="color:var(--muted);font-weight:400">${g.costumeCount}</span></div><div class="ov-gear-items">`;
            g.costumes.forEach((c, i) => { html += renderGearChip('costume', i, c.detail ? `${c.name}（${c.detail}）` : c.name); });
            html += `</div></div>`;
            [{ key: 'makeup', label: '补妆用品' }, { key: 'dolls', label: '娃娃' }, { key: 'photography', label: '摄影器材' }, { key: 'props', label: '道具' }, { key: 'medicine', label: '药品' }, { key: 'snacks', label: '零食' }].forEach(cat => {
                const items = g[cat.key];
                if (!items || !items.length) return;
                html += `<div class="ov-gear-group"><div class="ov-gear-label">${cat.label}</div><div class="ov-gear-items">`;
                items.forEach((item, i) => { html += renderGearChip(cat.key, i, item); });
                html += `</div></div>`;
            });
            html += `</div>`;

            html += `<div class="ov-card"><div class="ov-card-title">三日行程</div>`;
            info.itinerary.forEach(day => {
                html += `<div class="ov-day-card"><div class="ov-day-header"><span class="ov-day-badge">${day.title}</span><span class="ov-day-date">${day.date}</span></div><div class="ov-day-items">`;
                day.items.forEach(item => {
                    const clickable = item.pointIds && item.pointIds.length;
                    const onclickAttr = clickable ? ` onclick="jumpToPoint(${item.pointIds[0]}, '${(item.characters || [''])[0]}')"` : '';
                    const arrow = clickable ? `<span class="ov-item-arrow">›</span>` : '';
                    const detail = item.detail ? `<div class="ov-item-detail">${item.detail}</div>` : '';
                    html += `<div class="ov-item${clickable ? ' clickable' : ''}"${onclickAttr}><span class="ov-item-icon">${item.icon}</span><div class="ov-item-body"><div class="ov-item-label">${item.label}</div>${detail}</div>${arrow}</div>`;
                });
                html += `</div></div>`;
            });
            html += `</div>`;

            document.getElementById('ovBody').innerHTML = html;
            renderGearStates();
        }

        function renderGearChip(cat, idx, label) {
            return `<span class="ov-gear-chip" data-cat="${cat}" data-idx="${idx}" onclick="toggleGear(this)"><span class="ov-gear-check">✓</span>${label}</span>`;
        }

        function toggleGear(el) {
            const key = el.dataset.cat + '-' + el.dataset.idx;
            if (gearChecked.has(key)) gearChecked.delete(key); else gearChecked.add(key);
            saveGearSet(gearChecked);
            el.classList.toggle('checked');
        }

        function renderGearStates() {
            document.querySelectorAll('.ov-gear-chip').forEach(el => {
                el.classList.toggle('checked', gearChecked.has(el.dataset.cat + '-' + el.dataset.idx));
            });
        }

        function jumpToPoint(pointId, characterName) {
            closeOverview();
            const point = huaniaoPoints.find(p => p.id === pointId);
            if (!point) return;
            const charIdx = point.characters.findIndex(c => c.name === characterName);
            showPanel(point, Math.max(0, charIdx));
        }

        window.onload = function () {
            if (!huaniaoPoints.length) { alert('未检测到有效拍摄数据，请检查 data.js 是否配置正确。'); return; }
            initFilterUI();
            initMap();
        };
    </script>
</body>
</html>
